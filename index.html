<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scatterboard" />
    <meta
      name="description"
      content="Scatterboard is a local-first infinite-canvas planning board. Notes, to-dos, images and sketches on one board, fully offline."
    />
    <meta property="og:title" content="Scatterboard" />
    <meta property="og:description" content="Local-first infinite-canvas planning board. Fully offline, no sign-up." />
    <meta property="og:type" content="website" />
    <style>
      html.dark {
        background: #1d1d19;
      }

      /* First-paint filler: three dots pulse in the page background
         until boot() mounts the app and removes the node. Kept inline
         so it renders before any bundle loads. */
      #boot-load {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      #boot-load span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #b9b9b0;
        animation: boot-dot 1s ease-in-out infinite;
      }

      #boot-load span:nth-child(2) {
        animation-delay: 0.15s;
      }

      #boot-load span:nth-child(3) {
        animation-delay: 0.3s;
      }

      html.dark #boot-load span {
        background: #626258;
      }

      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-load span {
          animation: none;
        }
      }
    </style>
    <script>
      // Resolve the theme before first paint so a dark boot never
      // flashes the light background. Mirrors ui/theme.ts: an explicit
      // choice lives in localStorage, unset follows the OS.
      try {
        var t = localStorage.getItem('scatterboard:theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1d1d19');
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Scatterboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7f7f4'/%3E%3Cg fill='%23b9b9b0'%3E%3Ccircle cx='9' cy='9' r='1.6'/%3E%3Ccircle cx='16' cy='9' r='1.6'/%3E%3Ccircle cx='23' cy='9' r='1.6'/%3E%3Ccircle cx='9' cy='16' r='1.6'/%3E%3Ccircle cx='16' cy='16' r='1.6'/%3E%3Ccircle cx='23' cy='16' r='1.6'/%3E%3Ccircle cx='9' cy='23' r='1.6'/%3E%3Ccircle cx='16' cy='23' r='1.6'/%3E%3Ccircle cx='23' cy='23' r='1.6'/%3E%3C/g%3E%3Crect x='11' y='11' width='10' height='8' rx='2' fill='%23356df3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="boot-load" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
