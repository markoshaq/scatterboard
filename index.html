<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Local-first allowlist: sqlite wasm needs wasm-eval and a worker;
         embed cards are https iframes; card images are blob:; unfurl
         previews and hero images reach https hosts; the agent bridge is
         a localhost websocket. Inline script/style stay for the
         first-paint theme boot. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.allorigins.win ws://127.0.0.1:* ws://localhost:* wss://127.0.0.1:*; worker-src 'self' blob:; frame-src https: blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scatterboard" />
    <meta
      name="description"
      content="Scatterboard is a local-first infinite-canvas planning board. Notes, to-dos, images and sketches on one board, fully offline."
    />
    <meta property="og:title" content="Scatterboard" />
    <meta property="og:description" content="Local-first infinite-canvas planning board. Fully offline, no sign-up." />
    <meta property="og:type" content="website" />
    <style>
      html.dark {
        background: #1d1d19;
      }

      /* First-paint filler: three dots pulse in the page background
         until boot() mounts the app and removes the node. Kept inline
         so it renders before any bundle loads. */
      #boot-load {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      #boot-load span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #b9b9b0;
        animation: boot-dot 1s ease-in-out infinite;
      }

      #boot-load span:nth-child(2) {
        animation-delay: 0.15s;
      }

      #boot-load span:nth-child(3) {
        animation-delay: 0.3s;
      }

      html.dark #boot-load span {
        background: #626258;
      }

      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-load span {
          animation: none;
        }
      }
    </style>
    <script>
      // Resolve the theme before first paint so a dark boot never
      // flashes the light background. Mirrors ui/theme.ts: an explicit
      // choice lives in localStorage, unset follows the OS.
      try {
        var t = localStorage.getItem('scatterboard:theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1d1d19');
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Scatterboard</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon-dark-192.png" type="image/png" sizes="192x192" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="app">
      <div id="boot-load" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
