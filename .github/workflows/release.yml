name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
      - name: Check bridge version matches
        run: |
          PKG="$(node -p "require('./package.json').version")"
          BRIDGE="$(node -p "require('./bridge/package.json').version")"
          if [ "$PKG" != "$BRIDGE" ]; then
            echo "bridge/package.json version ${BRIDGE} does not match package.json version ${PKG}"
            exit 1
          fi
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            BEGIN { gsub(/\./, "\\.", v); pat = "^## \\[" v "\\]" }
            $0 ~ pat { flag = 1; next }
            /^## \[/ && flag { exit }
            flag
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for ${VERSION}"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      # prebuild runs typecheck + tests inside npm run build.
      - run: npm run build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md
