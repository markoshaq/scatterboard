name: pages

# Deploys dist/ to GitHub Pages on release tags (v*), matching
# release.yml. Requires repo Settings > Pages > Source =
# "GitHub Actions" (public repo, or private on a paid plan).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          # Project page lives under /scatterboard/; vite.config reads
          # this for the asset base path.
          SCATTERBOARD_BASE: /scatterboard/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
