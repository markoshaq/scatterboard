name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # prebuild runs typecheck + tests inside npm run build.
      - run: npm run build
      - run: npm run coverage
      - name: Bridge smoke
        run: |
          npm --prefix bridge ci
          node --check bridge/agent.mjs
          node --check bridge/install.mjs
